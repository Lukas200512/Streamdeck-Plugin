<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<title>Shutdown Settings</title>
	<link rel="stylesheet" href="https://sdpi-components.dev/css/sdpi.css" />
	<script src="https://sdpi-components.dev/js/sdpi-components.js"></script>
</head>
<body>
	<sdpi-item label="Countdown (sec)">
		<sdpi-range setting="countdownSeconds" min="3" max="60" step="1" default="10" showlabels></sdpi-range>
	</sdpi-item>

	<sdpi-item label="Power Action">
		<sdpi-select setting="powerAction" placeholder="Choose action">
			<option value="shutdown">Shutdown</option>
			<option value="restart">Restart</option>
			<option value="sleep">Sleep</option>
			<option value="hibernate">Hibernate</option>
			<option value="logoff">Log Off</option>
		</sdpi-select>
	</sdpi-item>

	<sdpi-item label="Accent Color">
		<sdpi-color setting="accentColor" default="#00d37f"></sdpi-color>
	</sdpi-item>

	<sdpi-item label="Multi-Tile">
		<sdpi-checkbox setting="multiTileLayout" default></sdpi-checkbox>
	</sdpi-item>

	<details>
		<summary style="color:#9b9b9b;cursor:pointer;margin:8px 10px;">Tips</summary>
		<div style="padding:4px 10px;color:#7a7a7a;font-size:12px;">
			<p><strong>Long-press</strong> the Master key to toggle <em>Armed / Preview</em> mode.</p>
			<p>When <span style="color:#ff3b30;font-weight:bold;">ARMED</span>, the countdown will execute the power action. In <span style="color:#3fa3ff;">PREVIEW</span> mode it only shows the animation.</p>
			<p>Place <em>Child</em> keys next to the Master for a multi-tile countdown display.</p>
		</div>
	</details>
</body>
</html>
